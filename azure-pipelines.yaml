# Azure Pipelines for Spring Boot AI Interaction Project

trigger:
  - main # Trigger on pushes to the main branch

pool:
  vmImage: 'ubuntu-latest' # Use a Linux agent (e.g., Ubuntu 22.04)

variables:
  # Define variables here or link to a variable group in Azure DevOps.
  # For sensitive values like API keys, use Azure Key Vault or Azure DevOps variable groups
  # and mark them as secret.
  # Example:
  # GEMINI_API_KEY: $(GeminiApiKey) # Assuming 'GeminiApiKey' is a secret variable in a variable group
  # OPENAI_API_KEY: $(OpenAIApiKey) # Assuming 'OpenAIApiKey' is a secret variable in a variable group
  
  JAVA_VERSION: '17'
  MAVEN_CACHE_FOLDER: '$(HOME)/.m2/repository'
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

  # SonarQube specific variables (replace placeholders)
  SONAR_QUBE_SERVICE_CONNECTION: 'Your SonarQube Service Connection' # Name of your SonarQube service connection
  SONAR_QUBE_PROJECT_KEY: 'ai-project' # Your SonarQube project key
  SONAR_QUBE_PROJECT_NAME: 'AI Interaction Project' # Your SonarQube project name
  # SONAR_QUBE_TOKEN: $(SonarQubeToken) # Define this as a secret variable in Azure DevOps

  # NEW: Containerization and AKS Deployment Variables
  AZURE_SERVICE_CONNECTION: 'Your Azure Service Connection Name' # Name of your Azure Service Connection
  AZURE_CONTAINER_REGISTRY: 'youracrname.azurecr.io' # e.g., myaicr.azurecr.io
  IMAGE_REPOSITORY: 'ai-app' # Name of the image in ACR
  IMAGE_TAG: '$(Build.BuildId)' # Use Azure DevOps Build ID as image tag
  AKS_CLUSTER_NAME: 'your-aks-cluster-name' # e.g., my-ai-aks
  KUBERNETES_NAMESPACE: 'default' # Namespace to deploy to in AKS

stages:
- stage: Build
  displayName: Build Project
  jobs:
  - job: BuildJob
    displayName: Build Spring Boot App
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Install Java $(JAVA_VERSION)'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitecture: 'x64'

    - task: Cache@2
      displayName: 'Cache Maven packages'
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        path: '$(MAVEN_CACHE_FOLDER)'
        restoreKeys: 'maven | "$(Agent.OS)"'

    - task: Maven@4
      displayName: 'Maven Build'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean install'
        options: '$(MAVEN_OPTS) -DskipTests' # Skip tests during build for faster feedback

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      condition: succeededOrFailed() # Publish artifacts even if tests fail

- stage: Test
  displayName: Run Tests
  jobs:
  - job: TestJob
    displayName: Run Unit and Integration Tests
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Install Java $(JAVA_VERSION)'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitecture: 'x64'

    - task: Cache@2
      displayName: 'Cache Maven packages'
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        path: '$(MAVEN_CACHE_FOLDER)'
        restoreKeys: 'maven | "$(Agent.OS)"'

    - task: Maven@4
      displayName: 'Maven Test'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test'
        options: '$(MAVEN_OPTS)'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mergeTestResults: true
        failTaskOnFailedTests: true

- stage: CodeQualityAndSecurity
  displayName: Code Quality & Security Scan
  jobs:
  - job: ScanJob
    displayName: Run Scans
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Install Java $(JAVA_VERSION)'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitecture: 'x64'

    - task: Cache@2
      displayName: 'Cache Maven packages'
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        path: '$(MAVEN_CACHE_FOLDER)'
        restoreKeys: 'maven | "$(Agent.OS)"'

    # SonarQube Analysis
    - task: SonarQubePrepare@5
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: '$(SONAR_QUBE_SERVICE_CONNECTION)'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_QUBE_PROJECT_KEY)'
        cliProjectName: '$(SONAR_QUBE_PROJECT_NAME)'
        cliSources: '.'

    - task: Maven@4
      displayName: 'Run SonarQube Analysis'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify sonar:sonar'
        options: '$(MAVEN_OPTS) -Dsonar.login=$(SONAR_QUBE_TOKEN)' # Pass token if defined as a secret variable

    - task: SonarQubePublish@5
      displayName: 'Publish SonarQube Results'
      inputs:
        pollingTimeoutSec: '300' # Wait for analysis to complete

    # OWASP Dependency-Check
    - task: DependencyCheck_1_0_0@1 # This task needs to be installed from the Azure DevOps Marketplace
      displayName: 'Run OWASP Dependency-Check'
      inputs:
        projectName: '$(SONAR_QUBE_PROJECT_NAME)'
        scanPath: '$(System.DefaultWorkingDirectory)'
        format: 'HTML,XML'
        outputDirectory: '$(Build.ArtifactStagingDirectory)/DependencyCheckReports'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Dependency-Check Reports'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/DependencyCheckReports'
        ArtifactName: 'DependencyCheckReports'
        publishLocation: 'Container'
      condition: succeededOrFailed()

- stage: Containerization
  displayName: Build & Push Container Image
  dependsOn: CodeQualityAndSecurity # Depends on previous stage
  jobs:
  - job: BuildAndPush
    displayName: Build and Push Docker Image
    steps:
    - task: Docker@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        containerRegistry: '$(AZURE_SERVICE_CONNECTION)' # Your Azure Service Connection
        repository: '$(IMAGE_REPOSITORY)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest # Also tag as latest
      env:
        # Pass API keys as build arguments if needed by Dockerfile (e.g., for multi-stage builds that need them)
        # DOCKER_BUILDKIT: 1 # Enable BuildKit for advanced features
        # GEMINI_API_KEY: $(GeminiApiKey)
        # OPENAI_API_KEY: $(OpenAIApiKey)
        # GROQ_API_KEY: $(GroqApiKey)

- stage: ImageSecurityScan
  displayName: Scan Container Image for Vulnerabilities
  dependsOn: Containerization # Depends on image being built and pushed
  jobs:
  - job: ScanImage
    displayName: Scan Image with Trivy
    steps:
    - task: Trivy@1 # This task needs to be installed from the Azure DevOps Marketplace
      displayName: 'Scan Image with Trivy'
      inputs:
        image: '$(AZURE_CONTAINER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)'
        scanType: 'image'
        # Optional: Set severity threshold to fail the pipeline
        # severity: 'HIGH'
        # exitCode: '1' # Fail pipeline if vulnerabilities of specified severity are found
        # outputFormat: 'table' # or 'json'
        # outputFilePath: '$(Build.ArtifactStagingDirectory)/TrivyReports/trivy-report.json'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Trivy Reports'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/TrivyReports'
        ArtifactName: 'TrivyReports'
        publishLocation: 'Container'
      condition: succeededOrFailed()

- stage: Deploy
  displayName: Deploy Application to AKS
  dependsOn: ImageSecurityScan # Depends on image being scanned
  jobs:
  - deployment: DeployJob
    displayName: Deploy to AKS
    environment: 'production' # Link to an Azure DevOps environment (optional)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            displayName: 'Deploy to AKS'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionConnection: '$(AZURE_SERVICE_CONNECTION)' # Your Azure Service Connection
              azureResourceFilteringType: 'ResourceGroup'
              resourceGroupName: 'your-aks-resource-group' # The resource group where your AKS cluster resides
              clusterType: 'Managed'
              clusterName: '$(AKS_CLUSTER_NAME)'
              namespace: '$(KUBERNETES_NAMESPACE)'
              command: 'apply'
              arguments: '-f k8s-app-deployment.yaml -f k8s-db-deployment.yaml -f k8s-monitoring-deployment.yaml' # Apply all your K8s manifests
              # Optional: Replace image tag in manifests before applying
              # containers: '$(AZURE_CONTAINER_REGISTRY)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)'
              # imagePullSecrets: 'your-image-pull-secret' # If AKS needs a secret to pull from ACR (often not needed if ACR is linked to AKS)
